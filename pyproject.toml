[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peft-doctor"
version = "0.9.1"
description = "PEFT Doctor: local pre-flight checks, auto-fixes, checkpoint recovery, reproducibility, and failure explanations for LoRA/QLoRA fine-tuning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Awais Akhtar" }
]
keywords = [
  "peft",
  "lora",
  "qlora",
  "fine-tuning",
  "parameter-efficient fine-tuning",
  "llm fine-tuning",
  "fine-tuning diagnostics",
  "transformers",
  "hugging-face",
  "pytorch",
  "trl",
  "bitsandbytes",
  "cuda",
  "out-of-memory",
  "nan-loss",
  "target-modules",
  "tokenizer",
  "adapter",
  "adapter-merge",
  "google colab",
  "instruction tuning",
  "chat template",
  "gradient checkpointing",
  "flash attention",
  "label masking",
  "deepspeed",
  "fsdp",
  "distributed training",
  "dataset validation",
  "training logs",
  "vram estimation",
  "adapter integrity",
  "checkpoint recovery",
  "reproducibility",
  "notebook validation",
  "privacy scanning",
  "retrieval",
  "hardware planning",
  "mlops",
  "llama",
  "qwen",
  "mistral",
  "llm",
  "debugging"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed"
]
dependencies = [
  "packaging>=23.0",
  "rich>=13.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "typing-extensions>=4.8; python_version < '3.11'"
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.10",
  "bitsandbytes>=0.47; platform_system != 'Windows'",
  "datasets>=3.0",
  "peft>=0.17",
  "protobuf>=4.25",
  "safetensors>=0.4",
  "sentencepiece>=0.1.99",
  "torch>=2.4",
  "transformers>=4.56",
  "trl>=0.23"
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.0"
]

[project.urls]
Homepage = "https://github.com/awais-akhtar/peft-doctor"
Repository = "https://github.com/awais-akhtar/peft-doctor"
Issues = "https://github.com/awais-akhtar/peft-doctor/issues"
Documentation = "https://github.com/awais-akhtar/peft-doctor#readme"

[project.scripts]
peft-doctor = "peft_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501"]
